<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mê Kitchen | Opening soon</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#22391f;               /* deep green ground */
  --paper:#faf7ef;             /* cream text */
  --muted:#93a68d;             /* light sage on the green ground */
  --dim:#d8e0d2;
  --line:#33502f;              /* hairline on green */
  --bad:#e0a99b;               /* error red, light enough for green */
  --display:'Space Grotesk',Inter,-apple-system,sans-serif;
  --body:'Geist',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --rb:10px;
  --pad:clamp(1.25rem,4vw,3.5rem);
}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;background:var(--ink);color:var(--paper);
  font-family:var(--body);font-weight:300;
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(2rem,5vw,3.5rem) var(--pad) 1.25rem;
  -webkit-font-smoothing:antialiased;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- centre stack ---------- */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;width:100%;max-width:900px;text-align:center}
.logo{height:clamp(48px,7.5vw,72px);width:auto;filter:brightness(0) invert(1)}
.tag{
  display:inline-block;font-family:var(--display);font-size:.6875rem;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;padding:.4rem .85rem;
  border-radius:999px;border:1px solid currentColor;color:var(--muted);
}
h1{
  font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:clamp(2.1rem,7vw,4.25rem);line-height:.94;letter-spacing:-.035em;margin:0;
}
h1 u{text-decoration:none;-webkit-text-stroke:.75px var(--paper);color:transparent}
.lede{font-size:clamp(.95rem,1.6vw,1.125rem);color:var(--dim);max-width:42ch;margin:0;line-height:1.55}

/* ---------- countdown ---------- */
/* Segmented like the site's sticky order island: hairline rules, small
   letter-spaced labels under big tabular figures. */
.count{
  display:flex;align-items:stretch;width:100%;max-width:430px;
  border:1px solid rgba(250,247,239,.16);border-radius:14px;
  background:rgba(250,247,239,.03);padding:.3rem;
}
.unit{flex:1;min-width:0;padding:.85rem .25rem;display:flex;flex-direction:column;gap:.35rem;justify-content:center}
.unit+.unit{border-left:1px solid rgba(250,247,239,.16)}
.num{
  font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;
  font-size:clamp(1.75rem,6vw,3rem);line-height:1;letter-spacing:-.03em;
}
.lbl{font-family:var(--display);font-size:.5625rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.done{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1.4rem;font-size:1.1rem}

/* ---------- notify list ---------- */
.notify{
  width:100%;max-width:470px;margin-top:1rem;
  display:flex;flex-direction:column;align-items:center;gap:1.4rem;
}
.notify h2{
  font-family:var(--display);font-weight:700;text-transform:uppercase;
  font-size:clamp(1.05rem,2.8vw,1.35rem);letter-spacing:-.01em;margin:0;
}
.notify form{display:flex;gap:.55rem;width:100%;flex-wrap:wrap}
.notify input[type=email]{
  flex:1 1 200px;min-width:0;background:transparent;border:1px solid var(--line);
  color:var(--paper);border-radius:var(--rb);padding:1.05rem 1.2rem;font:inherit;font-size:.9375rem;
  transition:border-color .25s;
}
.notify input[type=email]::placeholder{color:#7d8f78}
.notify input[type=email]:focus{outline:none;border-color:var(--paper)}
/* same centre-out fill the site's buttons use */
.notify button{
  position:relative;isolation:isolate;overflow:hidden;flex:0 0 auto;
  font-family:var(--display);font-weight:700;font-size:.75rem;letter-spacing:.08em;
  text-transform:uppercase;padding:1.05rem 1.7rem;border-radius:var(--rb);
  background:transparent;color:var(--paper);border:1px solid var(--paper);
  cursor:pointer;transition:color .3s;
}
.notify button::before{
  content:"";position:absolute;inset:0;z-index:-1;background:var(--paper);
  transform:scaleX(0);transform-origin:center;
  transition:transform .55s cubic-bezier(.2,.8,.2,1);
}
.notify button:hover::before,.notify button:focus-visible::before{transform:scaleX(1)}
.notify button:hover,.notify button:focus-visible{color:var(--ink)}
.notify button[disabled]{opacity:.55;cursor:default}
.notify button[disabled]::before{transform:scaleX(0)}
.hide{position:absolute;left:-9999px}
.note{font-size:.75rem;color:var(--muted);margin:0;min-height:1em}
.note.bad{color:var(--bad)}
/* success swaps the form out entirely */
.ok{display:none;flex-direction:column;align-items:center;gap:.4rem;animation:rise .4s ease both}
.notify.done form{display:none}
.notify.done .ok{display:flex}
.ok strong{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:1rem}
.ok span{font-size:.8125rem;color:var(--dim)}

/* ---------- footer + concealed unlock ---------- */
footer{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:1rem;padding-top:2rem}
.meta{font-size:.75rem;letter-spacing:.04em;color:var(--muted);margin:0}
/* the way in: a dim full stop. Reachable by keyboard, easy to miss by eye. */
.dot{
  appearance:none;background:none;border:0;cursor:pointer;padding:.6rem;
  line-height:0;opacity:.22;transition:opacity .3s;
}
.dot:hover,.dot:focus-visible{opacity:.6}
.dot span{display:block;width:7px;height:7px;border-radius:50%;background:var(--paper)}
.gate{
  display:none;gap:.4rem;align-items:center;justify-content:center;flex-wrap:wrap;
  animation:rise .35s ease both;
}
.gate.on{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gate input{
  background:transparent;border:1px solid var(--line);color:var(--paper);
  border-radius:var(--rb);padding:.7rem .9rem;font:inherit;font-size:.875rem;
  width:min(230px,60vw);
}
.gate input::placeholder{color:#7d8f78}
.gate input:focus{outline:none;border-color:var(--paper)}
.gate button{
  font-family:var(--display);font-weight:700;font-size:.6875rem;letter-spacing:.1em;
  text-transform:uppercase;padding:.75rem 1.15rem;border-radius:var(--rb);
  background:var(--paper);color:var(--ink);border:1px solid var(--paper);cursor:pointer;
}
.social{display:flex;gap:1.1rem;align-items:center}
.social a{color:var(--muted);opacity:.8;line-height:0;transition:opacity .25s,color .25s}
.social a:hover,.social a:focus-visible{opacity:1;color:var(--paper)}
.social svg{width:18px;height:18px;display:block}
.msg{font-size:.75rem;color:var(--bad);min-height:1em;margin:0}
.shake{animation:shake .32s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)} 75%{transform:translateX(-3px)}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<main>
  <img class="logo" src="assets/logo-mark.png" alt="Mê Kitchen">
  <span class="tag">U District · Seattle</span>
  <h1>Phở.<br>Bánh mì.<br><u>Rice bowls.</u></h1>
  <p class="lede">Order on your phone, walk in, walk out. We are firing up the broth — doors open soon.</p>

  <div class="count" id="count" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="d">--</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">--</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">--</span><span class="lbl">Minutes</span></div>
    <div class="unit"><span class="num" id="s">--</span><span class="lbl">Seconds</span></div>
  </div>

  <section class="notify" id="notify">
    <h2>Be first through the door!</h2>

    <form name="notify" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="notifyForm">
      <input type="hidden" name="form-name" value="notify">
      <p class="hide"><label>Skip this field: <input name="bot-field"></label></p>
      <label class="sr" for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
      <button type="submit" id="notifyBtn">I'm in</button>
    </form>

    <div class="ok">
      <strong>You're on the list</strong>
      <span>See you 30 September. Bring an appetite.</span>
    </div>

    <p class="note" id="notifyNote"></p>
  </section>
</main>

<footer>
  <p class="meta">Mê Kitchen · Seattle, WA</p>

  <nav class="social" aria-label="Social media">
    <a href="https://www.instagram.com/mekitchen.wa/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
    <a href="https://www.tiktok.com/@mekitchen.wa" target="_blank" rel="noopener" aria-label="TikTok">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M16.6 5.82c-.9-.86-1.46-2-1.6-3.32h-3.02v13.2c0 1.5-1.22 2.72-2.72 2.72a2.72 2.72 0 0 1 0-5.44c.28 0 .56.04.82.12V9.9a5.75 5.75 0 0 0-.82-.06 5.75 5.75 0 1 0 5.75 5.75V8.9a8.6 8.6 0 0 0 4.6 1.34V7.2a5.6 5.6 0 0 1-3.01-1.38z"/>
      </svg>
    </a>
  </nav>

  <button class="dot" id="dot" aria-label="Staff preview access"><span></span></button>

  <form class="gate" id="gate" autocomplete="off">
    <label class="sr" for="pw">Preview password</label>
    <input type="password" id="pw" placeholder="Password" autocomplete="off">
    <button type="submit">Enter</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
</footer>

<script>
(function(){
  'use strict';

  /* ---------------------------------------------------------------
     CHANGE THESE TWO
     LAUNCH  — the opening date/time. Placeholder until the real
               opening date is confirmed. Local time.
     PASS    — the preview password.
     --------------------------------------------------------------- */
  var LAUNCH = new Date('2026-09-30T11:00:00');
  var PASS   = 'Mekitchen123';

  /* countdown */
  var d=document.getElementById('d'), h=document.getElementById('h'),
      m=document.getElementById('m'), s=document.getElementById('s'),
      box=document.getElementById('count'), timer;

  function pad(n){ return n<10 ? '0'+n : ''+n; }

  function tick(){
    var left = LAUNCH - new Date();
    if(left <= 0){
      clearInterval(timer);
      box.innerHTML = '<div class="done">We are open</div>';
      return;
    }
    var sec = Math.floor(left/1000);
    d.textContent = Math.floor(sec/86400);
    h.textContent = pad(Math.floor(sec/3600)%24);
    m.textContent = pad(Math.floor(sec/60)%60);
    s.textContent = pad(sec%60);
  }
  tick();
  timer = setInterval(tick, 1000);

  /* notify list — posts to Netlify Forms without leaving the page, so the
     countdown keeps running. Only works on the deployed Netlify site; a local
     static server has nothing to accept the POST. */
  var nForm=document.getElementById('notifyForm'), nBtn=document.getElementById('notifyBtn'),
      nNote=document.getElementById('notifyNote'), nBox=document.getElementById('notify');

  nForm.addEventListener('submit', function(e){
    e.preventDefault();
    nNote.className='note';
    nNote.textContent='';
    nBtn.disabled=true;
    nBtn.textContent='Saving…';

    fetch('/', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams(new FormData(nForm)).toString()
    })
    .then(function(res){
      if(!res.ok) throw new Error(res.status);
      nBox.classList.add('done');
    })
    .catch(function(){
      nBtn.disabled=false;
      nBtn.textContent="I'm in";
      nNote.className='note bad';
      nNote.textContent='That did not save — try again in a moment.';
    });
  });

  /* concealed preview gate */
  var dot=document.getElementById('dot'), gate=document.getElementById('gate'),
      pw=document.getElementById('pw'), msg=document.getElementById('msg');

  dot.addEventListener('click', function(){
    gate.classList.toggle('on');
    if(gate.classList.contains('on')) pw.focus();
  });

  gate.addEventListener('submit', function(e){
    e.preventDefault();
    if(pw.value === PASS){
      msg.style.color = '#a8dd93';
      msg.textContent = 'Unlocked — loading the site…';
      try { sessionStorage.setItem('mk_preview','1'); } catch(err){}
      setTimeout(function(){ window.location.href = '/'; }, 500);
    } else {
      msg.style.color = '';
      msg.textContent = 'Not quite.';
      gate.classList.remove('shake');
      void gate.offsetWidth;            /* restart the animation */
      gate.classList.add('shake');
      pw.select();
    }
  });
})();
</script>
</body>
</html>
