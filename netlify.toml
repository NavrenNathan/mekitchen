# Mê Kitchen — Netlify configuration
# Static site, no build step. Netlify serves the folder as-is.

[build]
  publish = "."

# --- Security headers -------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    # Everything comes from this site: fonts are self-hosted in /fonts and
    # page scripts live in /assets/js. Forms post and fetch back to this
    # origin only. Scripts: only files from this site, plus the home page's
    # one-line head script, allowed by its hash (if you edit that line, run
    # `node scripts/stamp-assets.mjs` and paste the new hash it prints here).
    # Styles still allow inline because pages use <style> blocks and
    # style="" attributes.
    # Google Analytics 4 (assets/js/analytics.js) is the one outside service:
    # the hosts are Google's documented list for GA4 *without* Ads features
    # (developers.google.com/tag-platform/security/guides/csp).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-ORf1yTYJCLzkZY6VfpkVmPY+ogn8mEJTG+AIVHGJgWQ=' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; media-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"

# --- Caching ----------------------------------------------------------
# HTML must revalidate so edits appear immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# A week, not a year + immutable: asset filenames carry no content hash, and
# files do get re-encoded in place under the same name (the 2026-09-22 media
# pass did exactly that), so "immutable" would pin returning visitors to the
# old file for a year. If assets are ever fingerprinted, this can go back up.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Font files are never edited in place (a new version would get a new name),
# so these can be cached for a year. Kept outside /assets/ so only one
# Cache-Control rule ever matches them (Netlify doesn't document how
# overlapping rules combine).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Redirects ---------------------------------------------------------
# The main site used to live at /site.html; it is now /home.html. Anything
# already shared with the old path still lands on the right page.
# The main site lives at the root (index.html). The coming-soon holding page
# and its password gate were retired on 22 Oct 2026. Until then the main site
# was at /home, so anything shared or bookmarked with /home still lands on
# the home page. /site.html is a legacy path from an earlier rename.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/site.html"
  to = "/"
  status = 301
  force = true

# publish = "." ships the whole repo, so internal docs and tooling were
# publicly downloadable (DEPLOY.md, scripts/, reports/, assets/README.md).
# Serve the 404 page for them instead.
[[redirects]]
  from = "/DEPLOY.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/assets/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/reports/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
