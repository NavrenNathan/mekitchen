# Mê Kitchen — Netlify configuration
# Static site, no build step. Netlify serves the folder as-is.

[build]
  publish = "."

# --- Security headers -------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- Caching ----------------------------------------------------------
# HTML must revalidate so edits appear immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are content-stable; cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Redirects ---------------------------------------------------------
# The main site used to live at /site.html; it is now /home.html. Anything
# already shared with the old path still lands on the right page.
[[redirects]]
  from = "/site.html"
  to = "/home.html"
  status = 301
  force = true
