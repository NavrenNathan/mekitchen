# Mê Kitchen — Netlify configuration
# Static site, no build step. Netlify serves the folder as-is.

[build]
  publish = "."

# --- Security headers -------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# --- Caching ----------------------------------------------------------
# HTML must revalidate so edits appear immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are content-stable; cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Redirects ---------------------------------------------------------
# The main site used to live at /site.html; it is now /home.html. Anything
# already shared with the old path still lands on the right page.
# The main site lives at /home again, with the coming-soon page at the root.
# /site.html is a legacy path from an earlier rename.
#
# NOTE: there is deliberately NO "/home.html -> /" rule here. That existed
# while the main site was at the root, and leaving it in place now would
# bounce every visitor off the real site and back onto the holding page.
[[redirects]]
  from = "/site.html"
  to = "/home"
  status = 301
  force = true
