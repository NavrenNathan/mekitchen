<style>
:root{
  --ink:#22391f;--paper:#faf7ef;--dim:#5e6e58;
  --display:'Space Grotesk',sans-serif;
  --body:'Geist',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--ink);color:var(--paper);
  font-family:var(--body);font-weight:300;line-height:1.6;
  display:grid;place-items:center;text-align:center;padding:2rem;
  -webkit-font-smoothing:antialiased;
}
.n{font-family:var(--display);font-weight:700;font-size:clamp(4rem,18vw,10rem);line-height:.85;letter-spacing:-.05em;margin:0 0 1rem;color:transparent;-webkit-text-stroke:2px #4f6b4c}
h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(1.5rem,5vw,2.5rem);letter-spacing:-.03em;margin:0 0 1rem}
p{color:#b6c4b0;max-width:38ch;margin:0 auto 2.25rem}
a{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:.8125rem;letter-spacing:.06em;
  text-transform:uppercase;padding:1rem 1.75rem;border-radius:999px;
  background:var(--paper);color:var(--ink);border:2px solid var(--paper);
  text-decoration:none;transition:transform .18s cubic-bezier(.2,.8,.2,1);
}
a:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
